services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradetech
      POSTGRES_PASSWORD: tradetech
      POSTGRES_DB: tradetech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradetech"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
