# Fly.io config for the same image (ADR 0004). Set the app name and secrets:
#   fly launch --no-deploy --copy-config
#   fly secrets set DATABASE_URL=... WEB_ORIGIN=https://<app>.fly.dev TRUST_PROXY=true
app = "tradetech"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # A live event must never scale to zero mid-round.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  memory = "512mb"
  cpus = 1
